name: Main Extension Distribution Pipeline
on:
  push:
    branches:
    - v2.0-community-stub
  pull_request: null
  workflow_dispatch: null
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{
    github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true
jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: Query-farm/extension-ci-tools/.github/workflows/_extension_distribution.yml@query-farm
    with:
      duckdb_version: v2.0-cyanoptera
      ci_tools_version: query-farm
      extension_name: airport
    secrets:
      ccache_remote_token: ${{ secrets.QUERY_FARM_CCACHE_TOKEN }}
