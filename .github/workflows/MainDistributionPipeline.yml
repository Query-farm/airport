name: Main Extension Distribution Pipeline
on:
  push:
    branches:
    - v2.0-community-stub
  pull_request: null
  workflow_dispatch: null
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{
    github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true
jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: Query-farm/extension-ci-tools/.github/workflows/build.yml@query-farm
    with:
      duckdb_version: v2.0.0
      ci_tools_version: query-farm
      groups: |
        main:
          config: extension_config.cmake
          toolchain: main
      exclude_archs: wasm_mvp;wasm_eh;wasm_threads
      # The stub test LOADs the binary from {BUILD_DIRECTORY}/extension/, which the
      # separate test jobs do not restore; the build jobs already run it on each binary.
      test_jobs: false
    secrets:
      ccache_remote_token: ${{ secrets.QUERY_FARM_CCACHE_TOKEN }}
